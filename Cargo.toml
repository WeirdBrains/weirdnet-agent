[package]
name = "weirdnet-agent"
version = "0.5.6"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet agent runtime: a model-agnostic agent loop with streaming events and cancellation, tool sources and registry, tiered approval policy with per-site grants and standing allows, research budgets, traces with citation checks, and remote inference (infer/1 and infer/2, catalog, pool with failover and resume)."
authors = ["Weird Brains LLC"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-agent"
documentation = "https://docs.rs/weirdnet-agent"
readme = "README.md"
keywords = ["agents", "llm", "inference", "p2p", "weirdnet"]
categories = ["asynchronous"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
default = []
# Scripted model, approver and closure tools for tests in downstream crates.
testing = []
# App side over weirdnet-net: find inference nodes among the user's linked devices and dial them.
pool = ["dep:weirdnet-net", "dep:weirdnet-sync", "dep:futures", "dep:tracing"]
# Inference side over weirdnet-net: accept infer/1, infer/2 and catalog/1 streams, and check
# callers against the weirdnet-sync roster.
serve = ["dep:weirdnet-net", "dep:weirdnet-sync", "dep:futures"]
# Synced jobs over the weirdnet-sync job log and leases: a typed job board whose jobs another
# device can claim and resume from the last checkpoint. Needs weirdnet-sync 0.8.2 or newer.
jobs = ["dep:weirdnet-net", "dep:weirdnet-sync", "dep:futures"]

[dependencies]
async-trait = "0.1"
cbor4ii = { version = "1.2", features = ["serde1", "use_std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

futures = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
weirdnet-net = { version = "0.8.0", optional = true }
weirdnet-sync = { version = ">=0.5.2, <0.9", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "test-util"] }

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "jobs"
required-features = ["jobs"]
